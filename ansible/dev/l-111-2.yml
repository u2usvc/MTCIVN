---
- name: configure L-111-2
  hosts:
    - l-111-2
  connection: network_cli
  gather_facts: false
  tasks:
    - name: set identity
      community.routeros.command:
        commands:
          - /system identity set name=MT-CHR-7
    - name: adjust console settings
      community.routeros.command:
        commands:
          - /system console screen set blank-interval=never line-count=40

    - name: link with l-111_2_3_4-1
      community.routeros.command:
        commands:
          - /ip address add address=10.11.11.12/24 interface=ether1 network=10.11.11.0 


