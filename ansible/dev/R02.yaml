---
- name: configure host
  hosts:
    - R02
  connection: network_cli
  gather_facts: false
  tasks:
    - name: set identity
      community.routeros.command:
        commands:
          - /system identity set name=R02
    - name: adjust console settings
      community.routeros.command:
        commands:
          - /system console screen set blank-interval=never line-count=40

    - name: configure VLAN bridge
      community.routeros.command:
        commands:
          - /interface/bridge/add name=vlan-br-1 vlan-filtering=yes
          - /interface/bridge/port/add bridge=vlan-br-1 interface=ether2
          - /interface/bridge/port/add bridge=vlan-br-1 interface=ether4 pvid=20
          - /interface/bridge/port/add bridge=vlan-br-1 interface=ether3 pvid=30
          - /interface/bridge/vlan/add bridge=vlan-br-1 tagged=ether2,vlan-br-1 untagged=ether4 vlan-ids=20
          - /interface/bridge/vlan/add bridge=vlan-br-1 tagged=vlan-br-1 untagged=ether3 vlan-ids=30
          - /interface/vlan/add name=vlan-20 vlan-id=20 interface=vlan-br-1
          - /interface/vlan/add name=vlan-30 vlan-id=30 interface=vlan-br-1
          - /ip/address/add address=192.168.20.2/24 interface=vlan-20
          - /ip/address/add address=192.168.30.1/24 interface=vlan-30

    - name: configure DHCP for VLAN-20
      community.routeros.command:
        commands:
          - /ip/pool/add name=vlan-20-pool ranges=192.168.20.100-192.168.20.200
          - /ip/dhcp-server/add interface=vlan-20 address-pool=vlan-20-pool name=vlan-20-dhcp disabled=no
          - /ip/dhcp-server/network/add address=192.168.20.0/24 dns-server=192.168.20.2 gateway=192.168.20.2 netmask=24

    - name: configure DHCP for VLAN-30
      community.routeros.command:
        commands:
          - /ip/pool/add name=vlan-30-pool ranges=192.168.30.100-192.168.30.200
          - /ip/dhcp-server/add interface=vlan-30 address-pool=vlan-30-pool name=vlan-30-dhcp disabled=no
          - /ip/dhcp-server/network/add address=192.168.30.0/24 dns-server=192.168.30.1 gateway=192.168.30.1 netmask=24
