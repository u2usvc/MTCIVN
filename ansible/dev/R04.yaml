---
- name: configure host
  hosts:
    - R04
  connection: network_cli
  gather_facts: false
  tasks:
    - name: set identity
      community.routeros.command:
        commands:
          - /system identity set name=R04
    - name: adjust console settings
      community.routeros.command:
        commands:
          - /system console screen set blank-interval=never line-count=40

    - name: assign addresses
      community.routeros.command:
        commands:
          - /ip address add address=10.11.31.12/24 interface=ether2 network=10.11.31.0
          - /ip address add address=10.11.32.12/24 interface=ether3 network=10.11.32.0

    - name: integrate OSPF
      block:
        - name: add loopback bridge
          community.routeros.command:
            commands:
              - /interface bridge add name=Lo0

        - name: add loopback address
          community.routeros.command:
            commands:
              - /ip address add address=10.0.0.4 interface=Lo0 network=10.0.0.4

    - name: add OSPF instance
      community.routeros.command:
        commands:
          - /routing ospf instance add disabled=no name=ospfv2-inst router-id=10.0.0.4

    - name: add OSPF area
      community.routeros.command:
        commands:
          - /routing ospf area add disabled=no instance=ospfv2-inst name=ospfv2-a0

    - name: add OSPF interface-template
      community.routeros.command:
        commands:
          - /routing ospf interface-template add area=ospfv2-a0 disabled=no interfaces=Lo0,ether2,ether3 networks=10.11.31.0/24,10.11.32.0/24,10.0.0.4/32 use-bfd=yes

    - name: add BFD
      community.routeros.command:
        commands:
          - /routing bfd configuration add interfaces=ether2,ether3 min-rx=1s min-tx=1s

    - name: configure MPLS LDP
      community.routeros.command:
        commands:
          - /mpls/ldp/add lsr-id=10.0.0.4 transport-addresses=10.0.0.4
          - /mpls/ldp/interface/add interface=ether2
          - /mpls/ldp/interface/add interface=ether3

    - name: configure VXLAN
      community.routeros.command:
        commands:
          - /interface/vxlan/add name=vxlan-vni-102 vni=102
          - /interface/vxlan/vteps/add interface=vxlan-vni-102 remote-ip=10.0.0.3
          - /interface/bridge/add name=vxlan-br-102
          - /interface/bridge/port/add interface=ether4 bridge=vxlan-br-102
          - /interface/bridge/port/add interface=vxlan-vni-102 bridge=vxlan-br-102

    - name: configure VPLS
      community.routeros.command:
        commands:
          - /interface/bridge/add name=vpls-tun-1
          - /interface/vpls/add name=vpls-tun-3-4 vpls-id=1:1213 peer=10.0.0.3
          - /interface/bridge/port/add interface=vpls-tun-3-4 bridge=vpls-tun-1
          - /interface/bridge/port/add interface=ether5 bridge=vpls-tun-1
