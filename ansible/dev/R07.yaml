---
- name: configure host
  hosts:
    - R07
  connection: network_cli
  gather_facts: false
  tasks:
    - name: set identity
      community.routeros.command:
        commands:
          - /system identity set name=R07
    - name: adjust console settings
      community.routeros.command:
        commands:
          - /system console screen set blank-interval=never line-count=40

    - name: assign an address
      community.routeros.command:
        commands:
          - /ip address add address=10.11.11.12/24 interface=ether2 network=10.11.11.0
          - /ip address add address=10.11.21.11/24 interface=ether3 network=10.11.21.0

    - name: integrate OSPF
      block:
        - name: add loopback bridge
          community.routeros.command:
            commands:
              - /interface bridge add name=Lo0

        - name: add loopback address
          community.routeros.command:
            commands:
              - /ip address add address=10.0.0.7 interface=Lo0 network=10.0.0.7

        - name: add OSPF instance
          community.routeros.command:
            commands:
              - /routing ospf instance add disabled=no name=ospfv2-inst router-id=10.0.0.7

        - name: add OSPF area
          community.routeros.command:
            commands:
              - /routing ospf area add disabled=no instance=ospfv2-inst name=ospfv2-a0

        - name: add OSPF interface-template for L-111
          community.routeros.command:
            commands:
              - /routing ospf interface-template add area=ospfv2-a0 disabled=no interfaces=Lo0,ether2,ether3 networks=10.11.11.0/24,10.11.21.0/24,10.0.0.7/32 use-bfd=yes

        - name: add BFD
          community.routeros.command:
            commands:
              - /routing bfd configuration add interfaces=ether2 min-rx=1s min-tx=1s

    - name: configure MPLS LDP
      community.routeros.command:
        commands:
          - /mpls/ldp/add lsr-id=10.0.0.7 transport-addresses=10.0.0.7
          - /mpls/ldp/interface/add interface=ether2
          - /mpls/ldp/interface/add interface=ether3
